# Local lab only. Moodle container has NOT been executed in the current environment.
services:
  lrs:
    image: yetanalytics/lrsql:v0.9.9
    command: ["/lrsql/bin/run_sqlite.sh"]
    ports: ["127.0.0.1:8090:8080"]
    environment:
      LRSQL_DB_NAME: /data/portfolio
      LRSQL_API_KEY_DEFAULT: ${LRS_KEY:?Run scripts/create-env.py}
      LRSQL_API_SECRET_DEFAULT: ${LRS_SECRET:?Run scripts/create-env.py}
      LRSQL_ADMIN_USER_DEFAULT: labadmin
      LRSQL_ADMIN_PASS_DEFAULT: ${LRS_ADMIN_PASSWORD:?Run scripts/create-env.py}
      LRSQL_AUTHORITY_URL: http://localhost:8090
      LRSQL_ALLOW_ALL_ORIGINS: 'false'
    volumes: ["lrs-data:/data"]
  moodle-db:
    image: postgres:16
    environment:
      POSTGRES_DB: moodle
      POSTGRES_USER: moodle
      POSTGRES_PASSWORD: ${MOODLE_DB_PASSWORD:?Run scripts/create-env.py}
    volumes: ["moodle-db:/var/lib/postgresql/data"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U moodle -d moodle"]
      interval: 5s
      timeout: 3s
      retries: 20
  moodle:
    build:
      context: .
      dockerfile: deployment/moodle/Dockerfile
    ports: ["127.0.0.1:8080:80"]
    environment:
      MOODLE_DB_PASSWORD: ${MOODLE_DB_PASSWORD:?Run scripts/create-env.py}
      MOODLE_ADMIN_PASSWORD: ${MOODLE_ADMIN_PASSWORD:?Run scripts/create-env.py}
    depends_on:
      moodle-db:
        condition: service_healthy
    volumes:
      - moodle-data:/var/moodledata
      - moodle-web:/var/www/html
volumes:
  lrs-data:
  moodle-db:
  moodle-data:
  moodle-web:
